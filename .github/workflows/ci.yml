name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: '1.14.9'
      - name: Audit frontend dependency lock
        run: npm audit --audit-level=high
      - name: Check frontend JavaScript syntax
        run: find app/web -maxdepth 1 -name '*.js' -exec node --check {} \;
      - name: Validate Terraform
        run: |
          terraform -chdir=infra/terraform fmt -check -recursive
          terraform -chdir=infra/terraform init -backend=false -input=false
          terraform -chdir=infra/terraform validate
      - name: Install API runtime deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-hosted.txt pytest
      - name: Compile backend modules
        run: python -m compileall app/backend
      - name: Validate API contract endpoint imports
        run: python -c "import app.backend.main as m; print(m.app.title)"
      - name: Build hosted backend image
        run: docker build --tag firstroll-ci .
      - name: Verify hosted Douban MCP handshake
        run: >-
          docker run --rm firstroll-ci python -c
          "import asyncio; from app.backend.main import douban_adapter;
          result = asyncio.run(douban_adapter.test_connection());
          assert result['cookie_configured'] is False;
          assert result['tools'] == ['list-movie-reviews', 'search-movie']"
      - name: Test hosted contracts
        run: >-
          python -m pytest -q
          tests/test_discovery.py
          tests/test_settings.py
          tests/test_hosted_mode.py
          tests/test_auth.py
          tests/test_quota.py
          tests/test_research_agent_contract.py
          tests/test_research_graph.py
          tests/test_video_sources.py
          tests/test_web_3d_assets.py
          tests/test_frontend_ci.py
      - name: Build hosted frontend
        env:
          FIRSTROLL_API_BASE: https://firstroll.example.com
          FIRSTROLL_SUPABASE_URL: https://example.supabase.co
          FIRSTROLL_SUPABASE_PUBLISHABLE_KEY: sb_publishable_test
        run: ./tools/build_web.sh
