task: firstroll_tooling_smoke
dataset_path: json
dataset_kwargs:
  data_files:
    test: evals/benchmark_tools/lm_eval/tooling-smoke.jsonl
test_split: test
output_type: generate_until
doc_to_text: "{{prompt}}"
doc_to_target: "{{target}}"
generation_kwargs:
  until:
    - "\n"
  do_sample: false
  max_gen_toks: 16
metric_list:
  - metric: exact_match
    aggregation: mean
    higher_is_better: true
metadata:
  version: 1.0
  scope: tooling_smoke_only
